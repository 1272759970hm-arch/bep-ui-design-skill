.yk-home-card[data-home-layout] .yk-home-row h3{font-size:18px;line-height:26px}
.yk-home-card[data-home-layout] .yk-home-row>div:first-child{display:flex;flex-direction:column;justify-content:space-between}
.yk-home-card[data-home-layout] .yk-home-number strong{font-size:30px;white-space:nowrap}
.yk-home-card[data-home-layout] .yk-home-number strong small{margin-left:2px}
.yk-home-card[data-home-layout] .yk-home-children{margin-top:12px;padding-top:10px}
.yk-home-card[data-home-layout] .yk-home-divider{margin:11.5px 0;border-color:#00b2b24d}

/* 2026/07/21 预警稿的局部样式。 */
.yk-warning-ranking header,.yk-warning-rules-dialog header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.yk-warning-ranking header h3,.yk-warning-rules-dialog h3{margin:0;color:#22262F;font-size:16px;font-weight:500}
.yk-warning-ranking header div{display:flex;align-items:center;gap:8px}
.yk-warning-ranking button,.yk-warning-rules-dialog button{color:#007B7B;min-height:32px}
.yk-warning-scroll{overflow-x:auto}
.yk-warning-scroll table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}
.yk-warning-scroll th,.yk-warning-scroll td{padding:0 8px;text-align:left;font-weight:400}
.yk-warning-scroll thead th{height:32px;color:#444F60;background:#F6F8FA}
.yk-warning-scroll tbody tr{height:40px;border-bottom:1px solid #E5E6EB}
.yk-warning-scroll td:last-child{text-align:center}
.yk-warning-lights{display:grid;grid-auto-columns:minmax(12px,1fr);grid-auto-flow:column;gap:4px;text-align:center;justify-items:center;align-items:center}
.yk-warning-light{display:block;width:8px;height:8px;border-radius:50%}
.yk-warning-light.green{background:#0FD486}
.yk-warning-light.yellow{background:#FFAC46}
.yk-warning-light.red{background:#FF375F}
.yk-warning-light.unknown{width:auto;height:auto;color:#9199A2}
.yk-warning-full-dialog,.yk-warning-rules-dialog{box-sizing:border-box;border:0;background:white;color:#444F60}
.yk-warning-full-dialog::backdrop,.yk-warning-rules-dialog::backdrop{background:#22262f66}
.yk-warning-full-dialog{inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:16px}
.yk-warning-full-dialog button{display:block;margin-left:auto}
.yk-warning-full-dialog table{min-width:465px}
.yk-warning-rules-dialog{inset:auto 0 0;width:min(100%,375px);max-width:none;margin:0 auto;padding:0;border-radius:12px 12px 0 0}
.yk-warning-rules-dialog header{padding:8px 16px}
.yk-warning-rules-body{max-height:min(660px,calc(100dvh - 64px));overflow:auto}
.yk-warning-rules-body img{display:block;width:100%;height:auto}
.yk-warning-sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.yk-date-wheel{scroll-snap-type:y mandatory}
.yk-date-wheel [data-date-option]{scroll-snap-align:center}
.yk-actual-range{overflow:hidden}
.yk-actual-range i{flex:0 1 0;min-width:0}

.yk-home-card[data-home-layout] .yk-home-children>div{display:flex;flex-direction:column;align-items:flex-start}
.yk-home-card[data-home-layout] .yk-home-children>div>span:not(.yk-comparison){font-size:14px;line-height:22px}
.yk-home-card[data-home-layout] .yk-home-children b{display:flex;align-items:baseline;white-space:nowrap}
.yk-home-card[data-home-layout] .yk-home-children .yk-comparison{height:20px;margin-top:-4px}
@media(min-width:370px){
 .yk-home-card[data-home-layout] .yk-home-children>div>span:not(.yk-comparison){text-wrap:nowrap}
}

/* Full-page calendar views from 6671:132304 / 132073 / 132460. */
.yk-root.yk-calendar-dialog{position:fixed;inset:0;box-sizing:border-box;width:min(100%,375px);height:100dvh;max-width:none;max-height:none;margin:0 auto;padding:0;border:0;background:#fff;color:#22262F;overflow:hidden}
.yk-calendar-dialog[open]{display:flex;flex-direction:column}
.yk-calendar-dialog::backdrop{background:#22262f66}
.yk-calendar-nav{position:relative;display:grid;place-items:center;flex:none;min-height:44px}
.yk-calendar-nav h2{margin:0;font-size:18px;line-height:26px;font-weight:500}
.yk-calendar-nav button{position:absolute;inset-inline-start:8px;display:grid;place-items:center;width:44px;height:44px}
.yk-calendar-context{display:flex;align-items:center;gap:8px;padding:16px 16px 12px}
.yk-calendar-context h3,.yk-calendar-month h3{margin:0;color:#22262F;font-size:20px;line-height:28px;font-weight:500}
.yk-calendar-context>span{padding:4px 10px;background:#F7F8FA;border-radius:4px;line-height:20px}
.yk-calendar-context select{min-width:0;margin-inline-start:auto;border:1px solid #EDF1F7;border-radius:4px;background:#fff;padding:4px;font-size:12px;color:#444F60}
.yk-calendar-guide{display:flex;justify-content:space-between;gap:6px;padding:12px 16px 20px;color:#9199A2}
.yk-calendar-guide>div{display:flex;align-items:center;flex-direction:column;text-align:center}
.yk-calendar-guide .active{color:#22262F}
.yk-calendar-guide strong{margin-top:8px;font-weight:500}
.yk-calendar-guide small{color:#9199A2;line-height:16px}
.yk-calendar-scroll{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px}
.yk-calendar-grid,.yk-calendar-week{display:grid;text-align:center;grid-template-columns:repeat(7,minmax(0,1fr))}

.yk-calendar-grid.months{grid-template-columns:repeat(4,minmax(0,1fr))}
.yk-calendar-week{position:sticky;top:0;z-index:1;background:#fff;height:38px;align-items:center;color:#444F60;border-bottom:1px solid #EDF1F7}

.yk-calendar-month h3 small{color:#9199A2;margin-right:6px;font-size:14px}

.yk-calendar-grid.days button,.yk-calendar-other{min-height:56px}
.yk-calendar-grid button>span{display:grid;place-items:center;min-width:36px;min-height:36px;padding:0 4px}

.yk-calendar-dot{position:absolute;bottom:9px;width:6px;height:6px;border-radius:50%;background:#00B2B2}

.yk-stage-conversion figcaption b{white-space:nowrap;font-variant-numeric:tabular-nums}

/* 6695:315631, signed amount and zero-centered inline bar. */
.yk-cashflow-inline table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px;line-height:20px}
.yk-cashflow-inline th,.yk-cashflow-inline td{padding:4px 0;text-align:left;overflow-wrap:anywhere}
.yk-cashflow-inline thead{font-size:12px;color:#9199A2;border-bottom:1px solid #E5E6EB}
.yk-cashflow-inline thead th:nth-child(1){width:34%}
.yk-cashflow-inline thead th:nth-child(2){width:25%;text-align:right}
.yk-cashflow-inline thead th:nth-child(3){text-align:right}
.yk-cashflow-inline tbody+tbody{border-top:1px solid #E5E6EB}
.yk-cashflow-inline tbody tr:not(.yk-cashflow-group) th{font-weight:400;color:#9199A2}
.yk-cashflow-inline .yk-cashflow-group th{color:#22262F;padding-top:8px}
.yk-cashflow-inline .yk-cashflow-value{text-align:right;font-variant-numeric:tabular-nums}
.yk-cashflow-value[data-sign=positive]{color:#0FD486}
.yk-cashflow-value[data-sign=negative]{color:#FF375F}
.yk-cashflow-track{position:relative;display:block;height:14px;margin:0 4px 0 8px}
.yk-cashflow-track::after{content:'';position:absolute;left:50%;width:1px;height:14px;background:#E5E6EB}
.yk-cashflow-track>span{position:absolute;top:4px;width:50%;height:6px;display:flex}
.yk-cashflow-track [data-direction=positive]{left:50%}
.yk-cashflow-track [data-direction=negative]{right:50%;justify-content:flex-end}
.yk-cashflow-track i{height:6px}
.yk-cashflow-track [data-direction=positive] i{border-radius:0 3px 3px 0;background:#0FD486}
.yk-cashflow-track [data-direction=negative] i{border-radius:3px 0 0 3px;background:#FF375F}

/* Source 6695:316767. The target rule and actual rule can move independently. */
.yk-target-summary{padding-inline-start:min(45%,142px);min-height:61px;color:#9199A2}
.yk-target-summary span{display:block;overflow-wrap:anywhere}
.yk-target-summary strong{display:block;color:#22262F;font:500 32px/40px 'PingFang SC',sans-serif}
.yk-target-bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(64px,24.75%);align-items:center;gap:10px}
.yk-target-track{position:relative;border-radius:4px 0 0 4px;background:#66a6ff24;height:40px}
.yk-target-fill{height:100%;display:flex;align-items:center;gap:2px;overflow:hidden;background:#BEF7FF;border-radius:inherit}
.yk-target-fill i{flex-basis:0;height:28px;border-radius:4px}
.yk-target-track>[data-actual-marker],.yk-target-track>[data-target-marker]{position:absolute;transform:translateX(-50%);width:1px}
.yk-target-track>[data-actual-marker]{top:-25px;height:72px;background:repeating-linear-gradient(#8EAAD4 0 4px,transparent 4px 6px)}
.yk-target-track>[data-target-marker]{top:-7px;height:54px;width:2px;background:#8EAAD4}
.yk-target-label{display:grid;color:#7595C3;overflow-wrap:anywhere}
.yk-target-label b{font-size:16px;font-weight:500}

/* Source 6695:316799. The optional extracted SVG supplies the original background. */
.yk-card.yk-charge-rate-target{max-width:329px;border-radius:22px;background-color:#fff;background-size:100% 100%;background-repeat:no-repeat;padding:16px 20px 20px}
.yk-charge-rate-target h3{margin-bottom:8px}
.yk-charge-rate-row+.yk-charge-rate-row{margin-top:17px;--fill:#56B8FF;--stripe:#66A6FF;--track:#EBF5FF;--reading:#3092ED}
.yk-charge-rate-label{display:flex;align-items:baseline;gap:4px 6px;flex-wrap:wrap;color:#191919;font-size:12px;line-height:18px}
.yk-charge-rate-label strong{color:var(--reading,#0DADAB);font:700 15px/20px 'Yikan DIN','PingFang SC',sans-serif}
.yk-charge-rate-label small{color:#647184;font-size:10px}
.yk-charge-rate-label em{margin-inline-start:auto;border-radius:7px;padding:1px 5px;font-size:9px;font-style:normal;color:#647184}
.yk-charge-rate-label em.below{background:#FFE8ED;color:#BE2038}
.yk-charge-rate-label em.met{background:#E3F9F9;color:#007B7B}
.yk-charge-rate-track{position:relative;height:6px;margin-top:5px;border-radius:3px;background:var(--track,#D6F5F5)}
.yk-charge-rate-track i{display:block;height:100%;border-radius:inherit;background:repeating-linear-gradient(135deg,var(--fill,#2DCAE0) 0 3px,var(--stripe,#0DADAB) 3px 4px,var(--fill,#2DCAE0) 4px 6px);opacity:.77}
.yk-charge-rate-track b{position:absolute;top:-3px;transform:translateX(-50%);height:12px;width:1px;background:#7595C3}

/* 6695:316197, count columns and a separately scaled percentage line. */
.yk-contract-scroll{overflow-x:auto}
.yk-contract-scroll svg{width:100%;display:block;max-width:none}
.yk-contract-scroll text{font:11px 'PingFang SC',sans-serif;fill:#647184}
.yk-contract-grid{fill:none;stroke:#E5E6EB;stroke-width:.5}
.yk-contract-selection{fill:#00b2b20d;visibility:hidden}
.yk-contract-trend .is-current .yk-contract-selection{visibility:visible}
.yk-contract-trend .is-current text{fill:#007B7B;font-weight:600}
.yk-contract-trend [data-contract-series=eligible]{fill:#33C1C1}
.yk-contract-trend [data-contract-series=signed]{fill:#66A7FF}
.yk-contract-trend [data-contract-series=rate] path{fill:none;stroke:#959CF9;stroke-width:1.5;stroke-linejoin:round}
.yk-contract-trend [data-contract-series=rate] circle{fill:#fff;stroke:#959CF9;stroke-width:1.5}
.yk-contract-legend{display:flex;justify-content:center;gap:6px 12px;flex-wrap:wrap;font-size:12px}
.yk-contract-legend label{display:flex;align-items:center;gap:4px}
.yk-contract-legend input{width:12px;height:12px;margin:0}
.yk-contract-legend [data-contract-toggle=eligible]{accent-color:#008989}
.yk-contract-legend [data-contract-toggle=signed]{accent-color:#407FE2}
.yk-contract-legend [data-contract-toggle=rate]{accent-color:#706FD0}
.yk-contract-period-picker{display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px;font-size:12px}
.yk-contract-period-picker select{max-width:70%;padding:2px 6px;border:1px solid #E5E6EB;border-radius:4px;background:#fff}
.yk-contract-detail{width:100%;table-layout:fixed;border-collapse:collapse;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.yk-contract-detail :is(td,th){padding:4px;overflow-wrap:anywhere}
.yk-contract-detail th{color:#647184;font-weight:400;background:#F7F8FA}

/* 4424:71307 / 71453 / 71596, tabbed withholding analysis. */
.yk-withholding>header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.yk-withholding>header h3{min-width:0;overflow-wrap:anywhere}
.yk-withholding-switch{display:flex;flex:none;gap:2px;padding:2px;border-radius:4px;background:#F7F8FA}
.yk-withholding-switch button{height:24px;min-width:52px;font-size:12px;line-height:20px;border-radius:3px}
.yk-withholding-switch [aria-pressed=true]{background:#fff;color:#007B7B;box-shadow:0 1px 3px #22262f14}
.yk-withholding .yk-contract-trend{margin:0;padding:0}
.yk-withholding [data-contract-summary]{text-align:center}
.yk-withholding [data-contract-summary] .yk-missing{min-height:96px;display:grid;place-items:center}
.yk-withholding-metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 12px;text-align:left;font-size:14px}
.yk-withholding-metrics div{display:flex;align-items:baseline;gap:4px 6px;flex-wrap:wrap}
.yk-withholding-metrics dt{color:#647184}
.yk-withholding-metrics dd{margin:0;color:#22262F;font-variant-numeric:tabular-nums}
.yk-withholding-metrics dt::before{content:'';display:inline-block;width:8px;height:8px;margin-inline-end:4px;border-radius:2px;background:#33C1C1}
.yk-withholding-metrics div+div dt::before{background:#66A7FF}
.yk-withholding-trend{margin-top:8px}
.yk-withholding-trend summary{padding:4px 0;cursor:pointer;color:#007B7B;font-size:12px}
.yk-withholding-trend .yk-contract-detail{margin-top:8px}
.yk-withholding-rankings>.yk-withholding-switch{margin:16px 16px 8px}
.yk-withholding-rankings>.yk-withholding-switch button{flex:1;min-width:0;height:30px}
.yk-withholding-rankings .yk-ranking-scope{margin:0 16px;border-radius:8px}

/* Five- and six-dimension layouts from 6695:316308 and 6695:316438. */
.yk-satisfaction>header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.yk-satisfaction>header span{font-size:12px;color:#647184}
.yk-card.yk-satisfaction[data-dimensions="6"]{max-width:329px;border-radius:22px;background-size:100% 100%;background-repeat:no-repeat}
.yk-satisfaction-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr) minmax(0,1fr);grid-template-rows:auto 1fr auto;gap:4px;align-items:center}
.yk-satisfaction-layout svg{width:100%;grid-area:2/2;align-self:center}
.yk-satisfaction-grid{fill:none;stroke:#DCE8F7;stroke-width:.6}
.yk-satisfaction-grid line{stroke:#E5EEF9}
.yk-satisfaction [data-satisfaction-shape]{stroke-width:1;fill:none;stroke:var(--shape-color)}
.yk-satisfaction [data-satisfaction-shape=current]{--shape-color:#5798F4}
.yk-satisfaction polygon[data-satisfaction-shape=current]{fill:#63A4F7;fill-opacity:.28}
.yk-satisfaction [data-satisfaction-shape=highest]{--shape-color:#949CF8}
.yk-satisfaction [data-satisfaction-shape=average]{--shape-color:#56B8FF}
.yk-satisfaction [data-satisfaction-points=current]{fill:#5798F4}
.yk-satisfaction [data-satisfaction-points=highest]{fill:#949CF8}
.yk-satisfaction [data-satisfaction-points=average]{fill:#56B8FF}
.yk-satisfaction .yk-satisfaction-layout button{min-width:0;width:100%;min-height:32px;border-radius:6px;padding:4px;color:#444F60;font-size:13px;line-height:18px;overflow-wrap:anywhere}
.yk-satisfaction[data-dimensions="5"] button[data-satisfaction-axis]{background:#fff;border:1px solid #EEE;text-align:left}
.yk-satisfaction button[data-satisfaction-axis][aria-pressed=true]{background:#EDF5FF;border-color:#B5D3FC;color:#2367A5}
.yk-satisfaction-layout button strong{display:block;font-size:15px;font-weight:500;line-height:20px}
.yk-satisfaction-layout [data-satisfaction-axis="0"]{grid-area:1/2;justify-self:center;max-width:105px}
.yk-satisfaction-layout [data-satisfaction-axis="1"]{grid-area:2/3}
.yk-satisfaction-layout [data-satisfaction-axis="2"]{grid-area:3/3}
.yk-satisfaction-layout [data-satisfaction-axis="3"]{grid-area:3/1}
.yk-satisfaction-layout [data-satisfaction-axis="4"]{grid-area:2/1}
.yk-satisfaction[data-dimensions="6"] .yk-satisfaction-layout{grid-template-rows:auto 1fr 1fr auto}
.yk-satisfaction[data-dimensions="6"] svg{grid-area:2/2/4/3}
.yk-satisfaction[data-dimensions="6"] [data-satisfaction-axis="3"]{grid-area:4/2}
.yk-satisfaction[data-dimensions="6"] [data-satisfaction-axis="4"]{grid-area:3/1}
.yk-satisfaction[data-dimensions="6"] [data-satisfaction-axis="5"]{grid-area:2/1}
.yk-satisfaction-compare,.yk-satisfaction-six-values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 0;padding-top:8px;border-top:1px solid #E5E6EB;text-align:center}
.yk-satisfaction-compare[hidden]{display:none}
.yk-satisfaction dt{font-size:12px;line-height:18px;overflow-wrap:anywhere;color:#647184}
.yk-satisfaction dd{margin:2px 0 0;color:#22262F;font-variant-numeric:tabular-nums}
.yk-satisfaction-six-values .is-current{background:#EDF5FF;border-radius:4px}
.yk-satisfaction-compare dt::before,.yk-satisfaction-six-values dt::before{content:'';display:inline-block;width:6px;height:6px;margin-inline-end:4px;border-radius:50%;background:var(--legend-color,#5798F4)}
.yk-satisfaction-compare div:nth-child(2){--legend-color:#949CF8}
.yk-satisfaction-compare div:nth-child(3){--legend-color:#56B8FF}
.yk-satisfaction-six-values div:nth-child(-n+2){--legend-color:#33C1C1}
.yk-satisfaction-six-values div:nth-child(3){--legend-color:#2DCAE0}
.yk-satisfaction-six-values div:nth-child(4){--legend-color:#949CF8}
.yk-satisfaction-six-values div:nth-child(5){--legend-color:#56B8FF}

/* 6695:315326. Color indicates sign, opacity distinguishes the comparison period. */
.yk-signed-plot{margin-top:8px;overflow-x:auto}
.yk-signed-plot svg{width:100%;max-width:none}
.yk-signed-plot text{font:11px 'PingFang SC',sans-serif;fill:#647184}
.yk-signed-grid path{fill:none;stroke:#E5E6EB;stroke-width:.5}
.yk-signed-plot [data-period-zero]{fill:none;stroke:#9199A2;stroke-width:.7}
.yk-signed-plot .yk-period-selection{fill:#00b2b20d;visibility:hidden}
.yk-signed-plot .is-current .yk-period-selection{visibility:visible}
.yk-signed-plot .is-current text{font-weight:600;fill:#007B7B}
.yk-signed-period [data-sign=positive]{fill:#33C1C1;background:#33C1C1}
.yk-signed-period [data-sign=negative]{fill:#FF375F;background:#FF375F}
.yk-signed-period [data-period-series=previous]{opacity:.5}
.yk-signed-period.is-current-only .yk-signed-plot [data-period-series=previous]{display:none}
.yk-signed-period.is-current-only .yk-signed-legend li:has([data-period-series=previous]){display:none}
.yk-signed-legend{display:flex;justify-content:center;flex-wrap:wrap;gap:2px 8px;margin:4px 0 8px;padding:0;list-style:none;font-size:11px}
.yk-signed-legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-inline-end:4px}
.yk-signed-controls{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:8px 0;font-size:12px}
.yk-signed-controls label{display:flex;align-items:center;gap:4px}
.yk-signed-controls select{max-width:120px;padding:2px 6px;border:1px solid #E5E6EB;border-radius:4px;background:#fff}

/* 6695:316042, deposits split into current year and prior years within one amount. */
.yk-year-amount-module{display:grid;grid-template-columns:minmax(0,1fr) 118px;align-items:center;gap:12px}
.yk-year-amount-module+.yk-year-amount-module{margin-top:12px;padding-top:12px;border-top:1px solid #E5E6EB}
.yk-year-amount-info h3{font-size:14px;line-height:22px;color:#647184}
.yk-year-amount-total{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:4px 0 8px}
.yk-year-amount-total strong{font-size:20px;line-height:26px;font-weight:600;overflow-wrap:anywhere}
.yk-year-amount-info dl{display:grid;gap:5px;margin:0}
.yk-year-amount-info dl>div{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:baseline;gap:2px 6px;font-size:12px;line-height:17px}
.yk-year-amount-info dt{color:#647184;overflow-wrap:anywhere}
.yk-year-amount-info dt i{display:inline-block;width:8px;height:8px;margin-inline-end:4px;border-radius:2px}
.yk-year-amount-info dd{margin:0;overflow-wrap:anywhere}
.yk-year-amount-info dd small{margin-inline-start:4px;color:#647184;font-size:11px}
.yk-year-amount-ring{position:relative;width:118px}
.yk-year-amount-ring>div{position:absolute;inset:22%;display:flex;flex-direction:column;justify-content:center;text-align:center;overflow-wrap:anywhere;line-height:16px}
.yk-year-amount-ring strong{font-size:15px;color:#22262F}
.yk-year-amount-ring span{font-size:11px;color:#647184}

/* 6695:315962, one whole with independently selectable parts. */
.yk-receipt-composition>header{display:flex;align-items:baseline;justify-content:space-between;gap:6px;flex-wrap:wrap}
.yk-receipt-composition>header span{color:#647184;font-size:12px}
.yk-receipt-composition>header b{color:#22262F;font-weight:500}
.yk-receipt-overview{display:grid;grid-template-columns:minmax(132px,2fr) minmax(0,1fr);align-items:center;gap:8px;margin:8px 0 12px}
.yk-receipt-ring{position:relative;max-width:180px;width:100%;justify-self:center}
.yk-receipt-ring svg{width:100%}
.yk-receipt-ring [data-receipt-slice]{stroke-width:32}
.yk-receipt-ring [data-receipt-slice].is-current{stroke-width:40}
.yk-receipt-ring>strong{position:absolute;inset:28%;display:grid;place-items:center;text-align:center;color:#22262F;font:600 clamp(15px,5vw,24px)/1.2 'PingFang SC',sans-serif;overflow-wrap:anywhere}
.yk-receipt-selection{display:grid;gap:2px;min-width:0;overflow-wrap:anywhere;border-inline-start:2px solid #00B2B2;padding-inline-start:8px}
.yk-receipt-selection span{color:#007B7B;font-size:12px}
.yk-receipt-selection strong{font-size:15px;font-weight:600;color:#22262F}
.yk-receipt-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.yk-receipt-options button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;text-align:left;padding:6px 4px;border:1px solid transparent;border-radius:6px;font-size:12px;line-height:17px;overflow-wrap:anywhere}
.yk-receipt-options button[aria-pressed=true]{background:#E8F8F8;border-color:#AADDDD}
.yk-receipt-options button i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-inline-end:4px}
.yk-receipt-options button strong{color:#22262F;font-weight:600}
.yk-receipt-options button small{color:#647184}

/* 6695:316886. Outer status marks and the annual-target progress use different inputs. */
.yk-monthly-gauge>header{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.yk-monthly-gauge>header label{font-size:12px;color:#647184}
.yk-monthly-gauge select{padding:2px 6px;border:1px solid #E5E6EB;border-radius:4px;background:#fff}
.yk-gauge-face{position:relative;margin-top:8px}
.yk-gauge-face svg{width:100%}
.yk-gauge-face [data-gauge-month] path{fill:none;stroke:var(--gauge-status);stroke-width:5;stroke-linecap:round}
.yk-gauge-face text{font:11px 'PingFang SC',sans-serif;fill:#647184}
.yk-monthly-gauge [data-status=met]{--gauge-status:#0FD486}
.yk-monthly-gauge [data-status=below]{--gauge-status:#FF375F}
.yk-monthly-gauge [data-status=unrated]{--gauge-status:#DCE8F7}
.yk-gauge-track,.yk-gauge-actual{fill:none;stroke-width:18;stroke-linecap:round}
.yk-gauge-track{stroke:#E0F0F8}
.yk-gauge-actual{stroke:#66A7FF}
.yk-gauge-rate{position:absolute;inset:59% 22% auto;display:grid;text-align:center}
.yk-gauge-rate strong{font:600 clamp(22px,7vw,32px)/1 'PingFang SC',sans-serif;color:#22262F}
.yk-gauge-rate span{font-size:11px;color:#647184}
.yk-gauge-status,.yk-gauge-note{margin:2px 0 6px;text-align:center;font-size:11px;color:#647184}
.yk-gauge-detail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0 0;padding-top:8px;border-top:1px solid #E5E6EB;text-align:center}
.yk-gauge-detail dt{font-size:11px;color:#647184}
.yk-gauge-detail dd{margin:0;font-size:13px;color:#22262F;overflow-wrap:anywhere}
.yk-gauge-legend{display:flex;justify-content:center;gap:2px 8px;flex-wrap:wrap;margin:8px 0 0;padding:0;list-style:none;font-size:10px;color:#647184}
.yk-gauge-legend i{display:inline-block;width:7px;height:7px;margin-inline-end:4px;border-radius:2px;background:var(--gauge-status)}

/* 6695:315115 / 315240, selected groups and 12px nominal source bars. */
.yk-category-columns>header{display:flex;align-items:baseline;justify-content:space-between;gap:6px;flex-wrap:wrap}
.yk-category-columns>header label{font-size:12px;color:#647184}
.yk-category-columns select{padding:2px 6px;border:1px solid #E5E6EB;border-radius:4px;background:#fff}
.yk-category-column-readings{display:flex;gap:6px 12px;flex-wrap:wrap;margin:8px 0}
.yk-category-column-readings[hidden]{display:none}
.yk-category-column-readings div{display:flex;align-items:baseline;gap:4px;font-size:12px}
.yk-category-column-readings dt{color:#647184}
.yk-category-column-readings dd{margin:0;color:#22262F;font-weight:500}
.yk-category-column-readings i{display:inline-block;width:8px;height:3px;border-radius:2px;margin-inline-end:4px;vertical-align:middle}
.yk-category-column-scroll{overflow-x:auto}
.yk-category-column-scroll svg{width:100%;max-width:none}
.yk-category-column-scroll text{font:11px 'PingFang SC',sans-serif;fill:#647184}
.yk-category-column-grid path{fill:none;stroke:#E5E6EB;stroke-width:.5}
.yk-category-column-highlight{fill:transparent}
.yk-category-column-scroll .is-current .yk-category-column-highlight{fill:#00b2b214}
.yk-category-column-scroll .is-current text{fill:#007B7B;font-weight:600}
.yk-category-column-scroll [data-category-column-group]{cursor:pointer}

/* 6695:314803 / 314937, one shared scale and one selected time. */
.yk-period-curves header{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap}
.yk-period-curves header label,.yk-curve-toggle{color:#647184;font-size:12px}
.yk-period-curves select{padding:2px 6px;border:1px solid #E5E6EB;border-radius:4px;background:#fff}
.yk-period-curves svg{width:100%;margin-top:8px}
.yk-period-curves svg text{font:11px 'PingFang SC',sans-serif;fill:#647184}
.yk-curve-grid path{stroke:#E5E5E5;stroke-width:.5;fill:none}
.yk-period-curves [data-curve-guide]{stroke:#9199A2;stroke-width:1;stroke-dasharray:2 2}
.yk-period-curves [data-curve-series] path{fill:none;stroke-linecap:round}
.yk-period-curves [data-curve-dot]{visibility:hidden;fill:#fff;stroke-width:1.6}
.yk-period-curves [data-curve-dot]:is(.is-current,.is-isolated){visibility:visible}
.yk-period-curves [data-curve-hit]{fill:transparent;cursor:pointer}
.yk-period-curves.hide-previous [data-curve-previous]{display:none}
.yk-period-curves [data-curve-reading][hidden]{display:none}
