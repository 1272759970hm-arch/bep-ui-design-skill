<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>任务执行 — BEP-S 独立生成测试</title>
<link rel="stylesheet" href="styles.css" />
<!--
  本页面由 Claude 仅依据 component-registry.json / design-tokens.json / mobile-ui-rules.md /
  page-patterns.md / validation.md / missing-components.json / design-system-conflicts.json /
  interaction-adaptive-tokens.json 生成，参照用户提供的"任务执行"原型截图做信息架构和布局，
  但配色改用了 BEP-S 已验证的真实 Token，没有照搬原型的暖黄色系。
  生成过程未调用 Figma MCP。
-->
</head>
<body>
  <main class="page" data-bep-page="任务执行">

    <header class="navbar"
      data-bep-component="导航栏"
      data-bep-status="REMOTE_INSTANCE"
      data-bep-source="component-registry"
      data-bep-verified="true">
      <button class="navbar__back" aria-label="返回" type="button">
        <svg width="12" height="12" viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true" data-bep-component="Icon(arrow-left)" data-bep-status="EXTERNAL_STANDARD" data-bep-source="icon-library" data-bep-verified="true">
          <path d="M724 218.3V141c0-6.7-7.7-10.4-12.9-6.3L260.3 486.8a31.86 31.86 0 0 0 0 50.3l450.8 352.1c5.3 4.1 12.9.4 12.9-6.3v-77.3c0-4.9-2.3-9.6-6.1-12.6l-360-281 360-281.1c3.8-3 6.1-7.7 6.1-12.6z"/>
        </svg>
      </button>
      <h1 class="navbar__title">任务执行</h1>
    </header>

    <div class="content">

      <!-- 任务信息卡 -->
      <section class="task-card"
        data-bep-component="卡片（基础单卡）"
        data-bep-status="SPEC_ONLY"
        data-bep-source="component-library"
        data-bep-verified="false">
        <div class="task-card__head">
          <div class="task-card__title-row">
            <h2 class="task-card__title">往欠一年以上催收任务</h2>
            <svg width="14" height="14" viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true" data-bep-component="Icon(info-circle)" data-bep-status="EXTERNAL_STANDARD" data-bep-source="icon-library" data-bep-verified="true">
              <path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm0 820c-205.4 0-372-166.6-372-372s166.6-372 372-372 372 166.6 372 372-166.6 372-372 372z"/>

            </svg>
          </div>
          <span class="tag tag--progress"
            data-bep-component="标签"
            data-bep-status="SPEC_ONLY"
            data-bep-source="component-library"
            data-bep-verified="false">进行中</span>
        </div>

        <div class="task-card__meta">
          <span>有效期至 2026-08-05</span>
          <span class="overdue">已逾期(2天)</span>
        </div>

        <div class="task-card__stat-row">
          <div class="stat">
            <div class="stat__value">18/36户</div>
            <div class="stat__label">完成房屋/总房屋</div>
          </div>
          <div class="stat stat--percent">当前 <span class="percent-value">50%</span></div>
        </div>

        <div class="progress"
          data-bep-component="Progress Bar 进度条"
          data-bep-status="AI_PROPOSED"
          data-bep-source="missing-components"
          data-bep-verified="false"
          data-bep-note="库内NOT_FOUND，missing-components.json已记录，本组件按视觉手工搭建，非真实组件">
          <div class="progress__track">
            <div class="progress__fill" style="width:50%"></div>
            <div class="progress__threshold"></div>
          </div>
          <span class="progress__threshold-label">应达100%</span>
        </div>
      </section>

      <!-- 执行方式选择器 -->
      <div class="method-selector"

        data-bep-source="ai-decision"
        data-bep-verified="false"
        data-bep-note="图标已改为icon-library.json里的真实Ant Design Icons(EXTERNAL_STANDARD)，下划线选中态概念借用页内标签栏(SPEC_ONLY)，卡片化外观非Registry既有模式">

          <span class="method-card__row">

          <span class="method-card__row">
            <svg width="18" height="18" viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true" data-bep-component="Icon(wechat)" data-bep-status="EXTERNAL_STANDARD" data-bep-source="icon-library" data-bep-verified="true"><path d="M690.1 377.4c5.9 0 11.8.2 17.6.5-24.4-128.7-158.3-227.1-319.9-227.1C209 150.8 64 271.4 64 420.2c0 81.1 43.6 154.2 111.9 203.6a21.5 21.5 0 0 1 9.1 17.6c0 2.4-.5 4.6-1.1 6.9-5.5 20.3-14.2 52.8-14.6 54.3-.7 2.6-1.7 5.2-1.7 7.9 0 5.9 4.8 10.8 10.8 10.8 2.3 0 4.2-.9 6.2-2l70.9-40.9c5.3-3.1 11-5 17.2-5 3.2 0 6.4.5 9.5 1.4 33.1 9.5 68.8 14.8 105.7 14.8 6 0 11.9-.1 17.8-.4-7.1-21-10.9-43.1-10.9-66 0-135.8 132.2-245.8 295.3-245.8zm-194.3-86.5c23.8 0 43.2 19.3 43.2 43.1s-19.3 43.1-43.2 43.1c-23.8 0-43.2-19.3-43.2-43.1s19.4-43.1 43.2-43.1zm-215.9 86.2c-23.8 0-43.2-19.3-43.2-43.1s19.3-43.1 43.2-43.1 43.2 19.3 43.2 43.1-19.4 43.1-43.2 43.1zm586.8 415.6c56.9-41.2 93.2-102 93.2-169.7 0-124-120.8-224.5-269.9-224.5-149 0-269.9 100.5-269.9 224.5S540.9 847.5 690 847.5c30.8 0 60.6-4.4 88.1-12.3 2.6-.8 5.2-1.2 7.9-1.2 5.2 0 9.9 1.6 14.3 4.1l59.1 34c1.7 1 3.3 1.7 5.2 1.7a9 9 0 0 0 6.4-2.6 9 9 0 0 0 2.6-6.4c0-2.2-.9-4.4-1.4-6.6-.3-1.2-7.6-28.3-12.2-45.3-.5-1.9-.9-3.8-.9-5.7.1-5.9 3.1-11.2 7.6-14.5zM600.2 587.2c-19.9 0-36-16.1-36-35.9 0-19.8 16.1-35.9 36-35.9s36 16.1 36 35.9c0 19.8-16.2 35.9-36 35.9zm179.9 0c-19.9 0-36-16.1-36-35.9 0-19.8 16.1-35.9 36-35.9s36 16.1 36 35.9a36.08 36.08 0 0 1-36 35.9z"/></svg>
            企微
            <svg class="info-icon" viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true" data-bep-component="Icon(info-circle)" data-bep-status="EXTERNAL_STANDARD" data-bep-source="icon-library" data-bep-verified="true"><path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm0 820c-205.4 0-372-166.6-372-372s166.6-372 372-372 372 166.6 372 372-166.6 372-372 372z"/><path d="M464 336a48 48 0 1 0 96 0 48 48 0 1 0-96 0zm72 112h-48c-4.4 0-8 3.6-8 8v272c0 4.4 3.6 8 8 8h48c4.4 0 8-3.6 8-8V456c0-4.4-3.6-8-8-8z"/></svg>
          </span>
          <span class="method-card__count">1/2次</span>
        </button>
        <button type="button" class="method-card" aria-pressed="false">
          <span class="method-card__row">
            <svg width="18" height="18" viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true" data-bep-component="Icon(phone)" data-bep-status="EXTERNAL_STANDARD" data-bep-source="icon-library" data-bep-verified="true"><path d="M877.1 238.7L770.6 132.3c-13-13-30.4-20.3-48.8-20.3s-35.8 7.2-48.8 20.3L558.3 246.8c-13 13-20.3 30.5-20.3 48.9 0 18.5 7.2 35.8 20.3 48.9l89.6 89.7a405.46 405.46 0 0 1-86.4 127.3c-36.7 36.9-79.6 66-127.2 86.6l-89.6-89.7c-13-13-30.4-20.3-48.8-20.3a68.2 68.2 0 0 0-48.8 20.3L132.3 673c-13 13-20.3 30.5-20.3 48.9 0 18.5 7.2 35.8 20.3 48.9l106.4 106.4c22.2 22.2 52.8 34.9 84.2 34.9 6.5 0 12.8-.5 19.2-1.6 132.4-21.8 263.8-92.3 369.9-198.3C818 606 888.4 474.6 910.4 342.1c6.3-37.6-6.3-76.3-33.3-103.4zm-37.6 91.5c-19.5 117.9-82.9 235.5-178.4 331s-213 158.9-330.9 178.4c-14.8 2.5-30-2.5-40.8-13.2L184.9 721.9 295.7 611l119.8 120 .9.9 21.6-8a481.29 481.29 0 0 0 285.7-285.8l8-21.6-120.8-120.7 110.8-110.9 104.5 104.5c10.8 10.8 15.8 26 13.3 40.8z"/></svg>

          </span>
          <span class="method-card__count">0/1次</span>
        </button>
      </div>

      <div class="section-head">
        <h3>执行房屋</h3>
      </div>

      <!-- 工具栏 -->
      <div class="toolbar">
        <button type="button" class="checkbox-all"
          data-bep-component="多选框（小方框）"
          data-bep-status="NOT_FOUND"
          data-bep-source="missing-components"
          data-bep-verified="false">
          <span class="checkbox-square"></span>
          全选
        </button>
        <div class="search-bar"
          data-bep-component="搜索栏"
          data-bep-status="SPEC_ONLY"
          data-bep-source="component-library"
          data-bep-verified="false">
          <svg width="16" height="16" viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true" data-bep-component="Icon(search)" data-bep-status="EXTERNAL_STANDARD" data-bep-source="icon-library" data-bep-verified="true"><path d="M909.6 854.5L649.9 594.8C690.2 542.7 712 479 712 412c0-80.2-31.3-155.4-87.9-212.1-56.6-56.7-132-87.9-212.1-87.9s-155.5 31.3-212.1 87.9C143.2 256.5 112 331.8 112 412c0 80.1 31.3 155.5 87.9 212.1C256.5 680.8 331.8 712 412 712c67 0 130.6-21.8 182.7-62l259.7 259.6a8.2 8.2 0 0 0 11.6 0l43.6-43.5a8.2 8.2 0 0 0 0-11.6zM570.4 570.4C528 612.7 471.8 636 412 636s-116-23.3-158.4-65.6C211.3 528 188 471.8 188 412s23.3-116.1 65.6-158.4C296 211.3 352.2 188 412 188s116.1 23.2 158.4 65.6S636 352.2 636 412s-23.3 116.1-65.6 158.4z"/></svg>
          <input type="text" placeholder="搜索房屋 / 业主" />
        </div>
        <button type="button" class="filter-btn" aria-label="筛选"
          data-bep-component="筛选图标"
          data-bep-status="NOT_FOUND"
          data-bep-source="missing-components"
          data-bep-verified="false">
          <svg width="18" height="18" viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true" data-bep-component="Icon(filter)" data-bep-status="EXTERNAL_STANDARD" data-bep-source="icon-library" data-bep-verified="true">
            <path d="M880.1 154H143.9c-24.5 0-39.8 26.7-27.5 48L349 597.4V838c0 17.7 14.2 32 31.8 32h262.4c17.6 0 31.8-14.3 31.8-32V597.4L907.7 202c12.2-21.3-3.1-48-27.6-48zM603.4 798H420.6V642h182.9v156zm9.6-236.6l-9.5 16.6h-183l-9.5-16.6L212.7 226h598.6L613 561.4z"/>
          </svg>
        </button>
      </div>

      <div class="status-group-head">
        <span>待处理</span>
        <span class="count">3户</span>
      </div>

      <!-- 房屋列表 -->
      <div class="house-list">

        <article class="house-card"
          data-bep-component="卡片（基础单卡，非Cell）"
          data-bep-status="SPEC_ONLY"
          data-bep-source="component-library"
          data-bep-verified="false">
          <button type="button" class="checkbox-square house-card__checkbox" aria-label="选择"
            data-bep-component="多选框（小方框）"
            data-bep-status="NOT_FOUND"
            data-bep-source="missing-components"
            data-bep-verified="false"></button>
          <div class="house-card__body">
            <div class="house-card__row-top">
              <div>
                <div class="house-card__address">凤凰城A区3栋1001</div>
                <div class="house-card__owner">陈先生</div>
              </div>
              <div class="house-card__amount">¥ 28,640.00</div>
            </div>
            <div class="house-card__row-bottom">
              <span class="house-card__status">未开始 · 0/1次</span>
              <button type="button" class="btn-small"
                data-bep-component="按钮（小尺寸）"
                data-bep-status="NOT_FOUND"
                data-bep-source="missing-components"
                data-bep-verified="false">去完成</button>
            </div>
          </div>
        </article>

        <article class="house-card"
          data-bep-component="卡片（基础单卡，非Cell）"
          data-bep-status="SPEC_ONLY"
          data-bep-source="component-library"
          data-bep-verified="false">
          <button type="button" class="checkbox-square house-card__checkbox" aria-label="选择"
            data-bep-component="多选框（小方框）"
            data-bep-status="NOT_FOUND"
            data-bep-source="missing-components"
            data-bep-verified="false"></button>
          <div class="house-card__body">
            <div class="house-card__row-top">
              <div>
                <div class="house-card__address">凤凰城A区5栋602</div>
                <div class="house-card__owner">林女士</div>
              </div>
              <div class="house-card__amount">¥ 16,820.50</div>
            </div>
            <div class="house-card__row-bottom">
              <span class="house-card__status">未开始 · 0/1次</span>
              <button type="button" class="btn-small"
                data-bep-component="按钮（小尺寸）"
                data-bep-status="NOT_FOUND"
                data-bep-source="missing-components"
                data-bep-verified="false">去完成</button>
            </div>
          </div>
        </article>

        <article class="house-card"
          data-bep-component="卡片（基础单卡，非Cell）"
          data-bep-status="SPEC_ONLY"
          data-bep-source="component-library"
          data-bep-verified="false">
          <button type="button" class="checkbox-square house-card__checkbox" aria-label="选择"
            data-bep-component="多选框（小方框）"
            data-bep-status="NOT_FOUND"
            data-bep-source="missing-components"
            data-bep-verified="false"></button>
          <div class="house-card__body">
            <div class="house-card__row-top">
              <div>
                <div class="house-card__address">凤凰城B区8栋901</div>
                <div class="house-card__owner">何女士</div>
              </div>
              <div class="house-card__amount">¥ 9,860.00</div>
            </div>
            <div class="house-card__row-bottom">
              <span class="house-card__status">进行中 · 0/1次</span>
              <button type="button" class="btn-small"
                data-bep-component="按钮（小尺寸）"
                data-bep-status="NOT_FOUND"
                data-bep-source="missing-components"
                data-bep-verified="false">去完成</button>

      </div>

    </div>
  </main>
</body>
