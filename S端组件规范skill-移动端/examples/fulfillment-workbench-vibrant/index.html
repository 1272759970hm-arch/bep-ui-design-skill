<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>履约工作台(大厂C端视觉版) — BEP-S 独立生成测试</title>
<link rel="stylesheet" href="styles.css" />
<!--
  本页面由 Claude 仅依据 component-registry.json / design-tokens.json / mobile-ui-rules.md /
  page-patterns.md / validation.md / missing-components.json / icon-library.json 生成。
  信息架构/模块/数据与用户"履约工作台"原型截图保持 1:1 一致（用户明确要求"严格按照原型的功能"）。
  与 fulfillment-workbench/ 那版的唯一差异是视觉风格：应用户要求做成"C端大厂设计风格，不要简约白色，
  icon更有设计感"，这是本页最大的 USER_OVERRIDE ——渐变头部/卡片投影/图标磨砂底盘/更大圆角均为
  这次明确指令触发，默认 BEP-S 规范是"卡片无投影无描边、圆角6px"，这版故意背离，报告里逐条标注。
  生成过程未调用 Figma MCP。
-->
</head>
<body>
  <main class="page" data-bep-page="履约工作台(大厂C端视觉版)">

    <!-- 渐变头部：USER_OVERRIDE，用户要求"不要简约白色"，改用品牌色渐变承托状态栏+导航栏+统计卡片，
         制造"卡片浮在色块上"的层次感，这是大厂C端App常见的Hero区处理方式，非BEP-S规范定义 -->
    <div class="hero">
      <div class="statusbar" aria-hidden="true">
        <span>9:41</span>
        <span class="statusbar__right">5G <span class="statusbar__battery"></span></span>
      </div>

      <!-- 导航栏：REMOTE_INSTANCE，"纯导航-右侧带文案"变体（唯一做过mainComponent深度解析的变体），
           标题字号18px是组件真实实现值，优先级高于全局24px Token，见 design-system-conflicts.json 第1条。
           背景色/文字色改为渐变头部上的白色版本，属USER_OVERRIDE视觉调整，组件结构/字号未变 -->
      <header class="navbar"
        data-bep-component="导航栏"
        data-bep-status="REMOTE_INSTANCE"
        data-bep-source="component-registry"
        data-bep-verified="true"
        data-bep-note="纯导航-右侧带文案 变体；标题18px为组件真实实现值(DESIGN_SYSTEM_CONFLICT，与全局24px Token冲突，此处遵循真实组件)；白色配色是USER_OVERRIDE，适配渐变头部">
        <h1 class="navbar__title">履约工作台</h1>
        <div class="navbar__store">
          <span>凤凰荟中心店</span>
          <svg class="icon icon--12" viewBox="0 0 48 48" aria-hidden="true"
            data-bep-component="Icon(chevron-down)" data-bep-status="EXTERNAL_STANDARD"
            data-bep-source="icon-library" data-bep-verified="true">
            <path d="M36 18L24 30L12 18" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
      </header>

      <!-- 实物商品卡片：卡片(SPEC_ONLY 基础单卡)。默认规范是无投影无描边，
           这里的投影/更大圆角是USER_OVERRIDE(用户要求"不要简约白色"的直接结果)，
           投影数值取design-tokens.json里shadow.card的真实记录值(此前默认关闭，现按例外条件启用) -->
      <section class="card stat-card"
        data-bep-component="卡片"
        data-bep-status="SPEC_ONLY"
        data-bep-source="component-registry"
        data-bep-verified="true"
        data-bep-note="USER_OVERRIDE：默认'基础单卡'无投影无描边，本版按用户'不要简约白色'的要求启用shadow.card投影+更大圆角(16px，AI_PROPOSED，非radius.card的6px)">
        <div class="stat-card__head">
          <h2 class="stat-card__title">实物商品</h2>
          <span class="tag tag--plain"
            data-bep-component="标签（普通）"
            data-bep-status="SPEC_ONLY"
            data-bep-source="component-registry"
            data-bep-verified="true">履约状态已拆分</span>
        </div>
        <div class="stat-row">
          <div class="stat-item">
            <div class="stat-item__num-chip stat-item__num-chip--danger">1</div>
            <div class="stat-item__label">配送异常</div>
          </div>
          <div class="stat-item">
            <div class="stat-item__num-chip stat-item__num-chip--brand">2</div>

          </div>
          <div class="stat-item">
            <div class="stat-item__num-chip">1</div>
            <div class="stat-item__label">配送中</div>

        </div>

        </div>
